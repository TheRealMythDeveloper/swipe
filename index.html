<DOCTYPE! html>
    <html lang="en"> 
        <head>
            <meta charset="UTF-8"> 
            <meta name="veiwport" content="width=device-width, initial-scale=1.0">
            <title>Swipe</title>
 <link rel="stylesheet" href="style.css">
        </head>

        <body>
            <main id="game">

    <section id="main-menu">

        <div class="logo">
            SWIPE
        </div>

        <p class="subtitle">A GAME OF SPEED AND PRECISION</p>

        <div class="menu-buttons">
            <button id="campaign-button">CAMPAIGN</button>
            <button id="endless-button">ENDLESS</button>
        </div>

        <p class="footer-text">HOW FAST CAN YOU REACT?</p>

    </section>
       <section id="game-screen" class="hidden">

    <header class="game-header">
        <span id="mode-label">CAMPAIGN</span>
        <span id="level-label">LEVEL 1</span>
        <span id="score-label">SCORE: 0</span>
    </header>

    <div id="game-area">
        <h1 id="challenge-title">GET READY</h1>
        <p id="challenge-instructions">Prepare yourself.</p>

        <div id="challenge-object"></div>
    </div>

    <div class="game-footer">
        <span id="timer-label">TIME: 10</span>
        <span id="progress-label">CHALLENGE 1 / 5</span>
    </div>

    <button id="back-button">BACK TO MENU</button>

</section>
</main>
            <script src="js/swipe.js"></script>
        </body>
    </html>
